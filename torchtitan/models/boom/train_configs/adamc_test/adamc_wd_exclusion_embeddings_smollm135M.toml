# torchtitan Config.toml
# AdamC optimizer test - weight decay exclusion for embeddings only

[job]
dump_folder = "./outputs"
description = "Smollm2 135M with AdamC optimizer - weight decay exclusion for embeddings only"
print_args = false
use_for_integration_test = true

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = true
# log_param_norms = true
# log_param_norms_freq = 10  # Log parameter norms every 10 steps

[model]
name = "boom"
flavor = "smollm135M"
# test folder with tokenizer.json, for debug purpose only
tokenizer_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamC"  # Using AdamC instead of AdamW
lr = 8e-4
eps = 1e-8
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
implementation = "foreach"  # Use foreach implementation (torch.compile handles fusion)
# Weight decay exclusion settings
wd_embeddings = false  # Exclude embeddings and output layer from weight decay
wd_norm = true        # Apply weight decay to normalization layers (with corrected scaling in AdamC)
wd_qknorm = true      # Apply weight decay to QKNorm layers (if enabled)

[lr_scheduler]
warmup_steps = 200  # lr scheduler warm up, normally 20% of the train steps
decay_ratio = 0.8  # lr scheduler decay ratio, 80% of the train steps
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 32
seq_len = 2048
max_norm = 1.0  # grad norm clipping
steps = 1000
compile = true
dataset = "c4"  # supported datasets: c4_test (2K), c4 (177M)
seed = 42  # for reproducibility
deterministic = true  # For full determinism (slower but exact reproducibility)

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default" # default / never / always
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable_checkpoint = false
folder = "checkpoint"
interval = 10
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"  # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = "selective"  # ["none", "selective", "full"]
selective_ac_option = '2'  # 'int' = ac every positive int layer or 'op', ac based on ops policy

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[validation]
enabled = false
dataset = "c4_validation"
freq = 5
steps = 100